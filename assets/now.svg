<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="120" rx="18" fill="#070d1c"/>

  <circle cx="42" cy="60" r="8" fill="#00e5ff">
    <animate
      attributeName="opacity"
      values="1;.25;1"
      dur="1.4s"
      repeatCount="indefinite"
