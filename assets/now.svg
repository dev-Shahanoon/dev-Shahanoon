  </circle>

  <text
    x="70"
    y="48"
    font-family="Arial, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#ffffff"
  >
    NOW BUILDING
  </text>

  <text
    x="70"
    y="80"
    font-family="monospace"
